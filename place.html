<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brazil &ndash; WDD 131 Place Page &ndash; Eduar J Fajardo</title>
  <meta name="description" content="Place page about Brazil for WDD 131, with country data, static weather conditions and a wind chill factor calculated with JavaScript.">
  <meta name="author" content="Eduar J Fajardo">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/place.css">
  <script src="scripts/place.js" defer></script>
</head>
<body>
  <header>
    <h1>Brazil</h1>
  </header>

  <main>
    <picture class="hero">
      <source srcset="images/rio-hero-large.webp" media="(min-width: 700px)" width="1200" height="600">
      <img src="images/rio-hero-small.webp" alt="Aerial view of Rio de Janeiro with the Sugarloaf Mountain and Guanabara Bay" width="600" height="700">
    </picture>

    <section class="card data">
      <h2>Data</h2>
      <dl>
        <dt>Area</dt>
        <dd>8,515,767 km&sup2;</dd>
        <dt>Population</dt>
        <dd>203,080,756</dd>
        <dt>Capital</dt>
        <dd>Bras&iacute;lia</dd>
        <dt>Language</dt>
        <dd>Portuguese</dd>
        <dt>Currency</dt>
        <dd>Real (BRL)</dd>
      </dl>
    </section>

    <section class="card weather">
      <h2>Weather</h2>
      <img class="weather-icon" src="images/partly-cloudy.svg" alt="" width="48" height="48">
      <dl>
        <dt>Temperature</dt>
        <dd>9 &deg;C</dd>
        <dt>Conditions</dt>
        <dd>Partly cloudy</dd>
        <dt>Wind</dt>
        <dd>15 km/h</dd>
        <dt>Wind Chill</dt>
        <dd id="windchill">N/A</dd>
      </dl>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> &#128681; Eduar J Fajardo &ndash; Valinhos, Brazil</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
