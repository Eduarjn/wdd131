<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Scatter chart of sound quality against bandwidth for six codecs. G.729 sits at 24 kbps with a score of 3.9, Opus at 40 kbps with 4.3, and G.711 and G.722 at 80 kbps with 4.4 and 4.5.">
  <rect x="0" y="0" width="520" height="320" fill="#F4F7FA"/>

  <text x="260" y="26" fill="#0B3D60" font-size="15" text-anchor="middle">Quality against bandwidth, per call</text>

  <!-- axes: x from 16 to 88 kbps, y from 3.6 to 4.6 MOS -->
  <line x1="70" y1="56" x2="70" y2="244" stroke="#1F2933" stroke-width="1.5"/>
  <line x1="70" y1="244" x2="486" y2="244" stroke="#1F2933" stroke-width="1.5"/>

  <line x1="70" y1="207" x2="486" y2="207" stroke="#D5DDE5" stroke-width="1"/>
  <line x1="70" y1="169" x2="486" y2="169" stroke="#D5DDE5" stroke-width="1"/>
  <line x1="70" y1="131" x2="486" y2="131" stroke="#D5DDE5" stroke-width="1"/>
  <line x1="70" y1="94" x2="486" y2="94" stroke="#D5DDE5" stroke-width="1"/>
  <line x1="70" y1="56" x2="486" y2="56" stroke="#D5DDE5" stroke-width="1"/>

  <text x="62" y="248" fill="#1F2933" font-size="11" text-anchor="end">3.6</text>
  <text x="62" y="211" fill="#1F2933" font-size="11" text-anchor="end">3.8</text>
  <text x="62" y="173" fill="#1F2933" font-size="11" text-anchor="end">4.0</text>
  <text x="62" y="135" fill="#1F2933" font-size="11" text-anchor="end">4.2</text>
  <text x="62" y="98" fill="#1F2933" font-size="11" text-anchor="end">4.4</text>
  <text x="62" y="60" fill="#1F2933" font-size="11" text-anchor="end">4.6</text>

  <text x="112" y="266" fill="#1F2933" font-size="11" text-anchor="middle">24</text>
  <text x="181" y="266" fill="#1F2933" font-size="11" text-anchor="middle">36</text>
  <text x="250" y="266" fill="#1F2933" font-size="11" text-anchor="middle">48</text>
  <text x="319" y="266" fill="#1F2933" font-size="11" text-anchor="middle">60</text>
  <text x="388" y="266" fill="#1F2933" font-size="11" text-anchor="middle">72</text>
  <text x="457" y="266" fill="#1F2933" font-size="11" text-anchor="middle">84</text>

  <!-- G.729: 24 kbps, 3.9 -->
  <circle cx="112" cy="188" r="7" fill="#0F6E5C"/>
  <text x="112" y="176" fill="#0B3D60" font-size="12" text-anchor="middle">G.729</text>

  <!-- iLBC: 31 kbps, 3.9 -->
  <circle cx="152" cy="188" r="7" fill="#0F6E5C"/>
  <text x="160" y="205" fill="#0B3D60" font-size="12">iLBC</text>

  <!-- Opus: 40 kbps, 4.3 -->
  <circle cx="204" cy="113" r="7" fill="#0F6E5C"/>
  <text x="204" y="101" fill="#0B3D60" font-size="12" text-anchor="middle">Opus</text>

  <!-- G.726: 48 kbps, 3.8 -->
  <circle cx="250" cy="207" r="7" fill="#0F6E5C"/>
  <text x="250" y="227" fill="#0B3D60" font-size="12" text-anchor="middle">G.726</text>

  <!-- G.722: 80 kbps, 4.5 -->
  <circle cx="434" cy="75" r="7" fill="#0F6E5C"/>
  <text x="434" y="63" fill="#0B3D60" font-size="12" text-anchor="middle">G.722</text>

  <!-- G.711: 80 kbps, 4.4 -->
  <circle cx="434" cy="94" r="7" fill="#FFC94D" stroke="#0B3D60" stroke-width="2"/>
  <text x="426" y="112" fill="#0B3D60" font-size="12" text-anchor="end">G.711</text>

  <text x="278" y="290" fill="#1F2933" font-size="13" text-anchor="middle">Bandwidth per call, kbps, one direction</text>
  <text x="260" y="310" fill="#4B5563" font-size="11" text-anchor="middle">Opus reaches 4.3 on half the bandwidth of G.711. That is the bargain.</text>
</svg>
