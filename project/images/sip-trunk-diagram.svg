<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Desk phones connect to an on-site PBX, which connects over a SIP trunk with five channels, four of them busy, to a carrier and then to the public telephone network.">
  <rect x="0" y="0" width="520" height="300" fill="#F4F7FA"/>

  <!-- desk phones -->
  <g>
    <rect x="16" y="86" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#0B3D60" stroke-width="2"/>
    <rect x="24" y="94" width="26" height="18" rx="3" fill="#0B3D60"/>
    <rect x="16" y="130" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#0B3D60" stroke-width="2"/>
    <rect x="24" y="138" width="26" height="18" rx="3" fill="#0B3D60"/>
    <rect x="16" y="174" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#0B3D60" stroke-width="2"/>
    <rect x="24" y="182" width="26" height="18" rx="3" fill="#0B3D60"/>
    <text x="52" y="232" fill="#1F2933" font-size="13" text-anchor="middle">Desk phones</text>
  </g>

  <line x1="90" y1="147" x2="126" y2="147" stroke="#0B3D60" stroke-width="2"/>

  <!-- pbx -->
  <g>
    <rect x="128" y="110" width="84" height="74" rx="6" fill="#0B3D60"/>
    <text x="170" y="142" fill="#FFFFFF" font-size="15" text-anchor="middle">PBX</text>
    <text x="170" y="162" fill="#FFC94D" font-size="11" text-anchor="middle">your switch</text>
    <text x="170" y="204" fill="#1F2933" font-size="12" text-anchor="middle">Routes extensions</text>
  </g>

  <line x1="214" y1="147" x2="246" y2="147" stroke="#0B3D60" stroke-width="2"/>

  <!-- sip trunk with channel slots -->
  <g>
    <rect x="248" y="96" width="112" height="102" rx="6" fill="#FFFFFF" stroke="#0F6E5C" stroke-width="2"/>
    <text x="304" y="88" fill="#0F6E5C" font-size="13" text-anchor="middle">SIP trunk</text>

    <rect x="260" y="110" width="88" height="12" rx="3" fill="#0F6E5C"/>
    <rect x="260" y="126" width="88" height="12" rx="3" fill="#0F6E5C"/>
    <rect x="260" y="142" width="88" height="12" rx="3" fill="#0F6E5C"/>
    <rect x="260" y="158" width="88" height="12" rx="3" fill="#0F6E5C"/>
    <rect x="260" y="174" width="88" height="12" rx="3" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>

    <text x="304" y="216" fill="#1F2933" font-size="12" text-anchor="middle">4 of 5 channels busy</text>
  </g>

  <line x1="362" y1="147" x2="394" y2="147" stroke="#0B3D60" stroke-width="2"/>

  <!-- carrier and pstn -->
  <g>
    <rect x="396" y="110" width="108" height="74" rx="6" fill="#0B3D60"/>
    <text x="450" y="142" fill="#FFFFFF" font-size="15" text-anchor="middle">Carrier</text>
    <text x="450" y="162" fill="#FFC94D" font-size="11" text-anchor="middle">to the PSTN</text>
    <text x="450" y="204" fill="#1F2933" font-size="12" text-anchor="middle">Bills per channel</text>
  </g>

  <text x="260" y="268" fill="#1F2933" font-size="13" text-anchor="middle">
    The fifth caller connects. The sixth hears a busy signal.
  </text>
</svg>
