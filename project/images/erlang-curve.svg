<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Line chart of blocking probability against channel count for ten erlangs of traffic. Blocking falls from twenty one percent at ten channels to under one percent at eighteen channels, then flattens.">
  <rect x="0" y="0" width="520" height="320" fill="#F4F7FA"/>

  <text x="260" y="26" fill="#0B3D60" font-size="15" text-anchor="middle">Blocking for 10 erlangs of traffic</text>

  <!-- plot frame: x from 10 to 22 channels, y from 0 to 25 percent -->
  <line x1="66" y1="56" x2="66" y2="248" stroke="#1F2933" stroke-width="1.5"/>
  <line x1="66" y1="248" x2="486" y2="248" stroke="#1F2933" stroke-width="1.5"/>

  <!-- y gridlines every 5 percent -->
  <line x1="66" y1="248" x2="486" y2="248" stroke="#D5DDE5" stroke-width="1"/>
  <line x1="66" y1="209" x2="486" y2="209" stroke="#D5DDE5" stroke-width="1"/>
  <line x1="66" y1="171" x2="486" y2="171" stroke="#D5DDE5" stroke-width="1"/>
  <line x1="66" y1="133" x2="486" y2="133" stroke="#D5DDE5" stroke-width="1"/>
  <line x1="66" y1="95" x2="486" y2="95" stroke="#D5DDE5" stroke-width="1"/>
  <line x1="66" y1="56" x2="486" y2="56" stroke="#D5DDE5" stroke-width="1"/>

  <text x="58" y="252" fill="#1F2933" font-size="11" text-anchor="end">0%</text>
  <text x="58" y="213" fill="#1F2933" font-size="11" text-anchor="end">5%</text>
  <text x="58" y="175" fill="#1F2933" font-size="11" text-anchor="end">10%</text>
  <text x="58" y="137" fill="#1F2933" font-size="11" text-anchor="end">15%</text>
  <text x="58" y="99" fill="#1F2933" font-size="11" text-anchor="end">20%</text>
  <text x="58" y="60" fill="#1F2933" font-size="11" text-anchor="end">25%</text>

  <!-- the curve: 10 to 22 channels -->
  <polyline fill="none" stroke="#0F6E5C" stroke-width="3"
            points="66,84 101,124 136,156 171,184 206,205 241,221 276,232 311,240 346,243 381,246 416,247 451,247 486,248"/>

  <!-- the one percent target -->
  <line x1="66" y1="240" x2="486" y2="240" stroke="#B3261E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="482" y="236" fill="#B3261E" font-size="11" text-anchor="end">1% target</text>

  <!-- marked points -->
  <circle cx="66" cy="84" r="5" fill="#0B3D60"/>
  <text x="76" y="80" fill="#0B3D60" font-size="12">10 channels: 21.5% blocked</text>

  <circle cx="346" cy="243" r="5" fill="#0B3D60"/>
  <text x="340" y="228" fill="#0B3D60" font-size="12" text-anchor="end">18 channels: 0.7% blocked</text>

  <!-- x axis labels -->
  <text x="66" y="268" fill="#1F2933" font-size="11" text-anchor="middle">10</text>
  <text x="136" y="268" fill="#1F2933" font-size="11" text-anchor="middle">12</text>
  <text x="206" y="268" fill="#1F2933" font-size="11" text-anchor="middle">14</text>
  <text x="276" y="268" fill="#1F2933" font-size="11" text-anchor="middle">16</text>
  <text x="346" y="268" fill="#1F2933" font-size="11" text-anchor="middle">18</text>
  <text x="416" y="268" fill="#1F2933" font-size="11" text-anchor="middle">20</text>
  <text x="486" y="268" fill="#1F2933" font-size="11" text-anchor="middle">22</text>

  <text x="276" y="292" fill="#1F2933" font-size="13" text-anchor="middle">Channels on the trunk</text>
  <text x="260" y="312" fill="#4B5563" font-size="11" text-anchor="middle">Past 18 channels the curve is flat: more money, no real gain.</text>
</svg>
